openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Broker-independent trading strategy workspace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Workspace overview
  - name: strategies
    description: Strategy design and versioning
  - name: strategy-monitoring
    description: Exact-version strategy evaluation state
  - name: concepts
    description: Trading concepts
  - name: conditions
    description: Reusable strategy conditions
  - name: markets
    description: Markets and instruments
  - name: trades
    description: Trade journal
  - name: performance
    description: Performance tracking
  - name: alerts
    description: User-created alerts
  - name: settings
    description: Workspace settings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get workspace summary
      responses:
        "200":
          description: Data-backed workspace summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /strategies:
    get:
      operationId: listStrategies
      tags: [strategies]
      summary: List strategies
      responses:
        "200":
          description: Strategy list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Strategy"
    post:
      operationId: createStrategy
      tags: [strategies]
      summary: Create a strategy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategyInput"
      responses:
        "201":
          description: Created strategy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Strategy"
  /strategies/{strategyId}:
    get:
      operationId: getStrategy
      tags: [strategies]
      summary: Get a strategy
      parameters:
        - $ref: "#/components/parameters/StrategyId"
      responses:
        "200":
          description: Strategy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Strategy"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateStrategy
      tags: [strategies]
      summary: Update a strategy
      parameters:
        - $ref: "#/components/parameters/StrategyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategyUpdate"
      responses:
        "200":
          description: Updated strategy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Strategy"
    delete:
      operationId: deleteStrategy
      tags: [strategies]
      summary: Delete a strategy
      parameters:
        - $ref: "#/components/parameters/StrategyId"
      responses:
        "204":
          description: Deleted
  /strategies/{strategyId}/duplicate:
    post:
      operationId: duplicateStrategy
      tags: [strategies]
      summary: Duplicate a strategy without its trade history
      parameters:
        - $ref: "#/components/parameters/StrategyId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategyDuplicateInput"
      responses:
        "201":
          description: Duplicated strategy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Strategy"
  /strategy-monitoring:
    get:
      operationId: listStrategyMonitors
      tags: [strategy-monitoring]
      summary: List monitoring state for active strategies
      responses:
        "200":
          description: Exact-version monitoring snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StrategyMonitor"
  /strategy-monitoring/evaluate:
    post:
      operationId: evaluateActiveStrategies
      tags: [strategy-monitoring]
      summary: Evaluate active strategies against available normalized market data
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategyMonitoringEvaluationRequest"
      responses:
        "200":
          description: Updated monitoring snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StrategyMonitor"
  /strategies/{strategyId}/versions:
    get:
      operationId: listStrategyVersions
      tags: [strategies]
      summary: List strategy versions
      parameters:
        - $ref: "#/components/parameters/StrategyId"
      responses:
        "200":
          description: Version list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StrategyVersion"
    post:
      operationId: createStrategyVersion
      tags: [strategies]
      summary: Create strategy version
      parameters:
        - $ref: "#/components/parameters/StrategyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategyVersionInput"
      responses:
        "201":
          description: Created version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyVersion"
  /strategies/{strategyId}/versions/{versionId}/conditions:
    get:
      operationId: listStrategyVersionConditions
      tags: [strategies]
      summary: List the immutable conditions captured by a version
      parameters:
        - $ref: "#/components/parameters/StrategyId"
        - $ref: "#/components/parameters/VersionId"
      responses:
        "200":
          description: Version condition snapshot
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StrategyVersionCondition"
  /strategies/{strategyId}/versions/{versionId}/activate:
    post:
      operationId: activateStrategyVersion
      tags: [strategies]
      summary: Activate an immutable strategy version and load it into the Builder
      parameters:
        - $ref: "#/components/parameters/StrategyId"
        - $ref: "#/components/parameters/VersionId"
      responses:
        "200":
          description: Activated version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyVersion"
  /strategies/{strategyId}/versions/{versionId}/clone:
    post:
      operationId: cloneStrategyVersion
      tags: [strategies]
      summary: Create a new immutable version from an existing version
      parameters:
        - $ref: "#/components/parameters/StrategyId"
        - $ref: "#/components/parameters/VersionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategyVersionCloneInput"
      responses:
        "201":
          description: Cloned version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyVersion"
  /strategies/{strategyId}/conditions:
    get:
      operationId: listStrategyConditions
      tags: [strategies]
      summary: List ordered strategy conditions
      parameters:
        - $ref: "#/components/parameters/StrategyId"
      responses:
        "200":
          description: Ordered strategy conditions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StrategyCondition"
    post:
      operationId: createStrategyCondition
      tags: [strategies]
      summary: Add a concept-based condition to a strategy
      parameters:
        - $ref: "#/components/parameters/StrategyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategyConditionInput"
      responses:
        "201":
          description: Created strategy condition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyCondition"
  /strategies/{strategyId}/conditions/reorder:
    patch:
      operationId: reorderStrategyConditions
      tags: [strategies]
      summary: Reorder strategy conditions
      parameters:
        - $ref: "#/components/parameters/StrategyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategyConditionReorderInput"
      responses:
        "200":
          description: Reordered strategy conditions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StrategyCondition"
  /strategies/{strategyId}/conditions/{conditionId}:
    patch:
      operationId: updateStrategyCondition
      tags: [strategies]
      summary: Update a strategy condition
      parameters:
        - $ref: "#/components/parameters/StrategyId"
        - $ref: "#/components/parameters/ConditionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategyConditionUpdate"
      responses:
        "200":
          description: Updated strategy condition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyCondition"
    delete:
      operationId: deleteStrategyCondition
      tags: [strategies]
      summary: Delete a strategy condition
      parameters:
        - $ref: "#/components/parameters/StrategyId"
        - $ref: "#/components/parameters/ConditionId"
      responses:
        "204":
          description: Deleted
  /concepts:
    get:
      operationId: listConcepts
      tags: [concepts]
      summary: List trading concepts
      responses:
        "200":
          description: Concept list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TradingConcept"
    post:
      operationId: createConcept
      tags: [concepts]
      summary: Create trading concept
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradingConceptInput"
      responses:
        "201":
          description: Created concept
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradingConcept"
  /concepts/{conceptId}:
    patch:
      operationId: updateConcept
      tags: [concepts]
      summary: Update trading concept
      parameters:
        - $ref: "#/components/parameters/ConceptId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradingConceptUpdate"
      responses:
        "200":
          description: Updated concept
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradingConcept"
    delete:
      operationId: deleteConcept
      tags: [concepts]
      summary: Delete trading concept
      parameters:
        - $ref: "#/components/parameters/ConceptId"
      responses:
        "204":
          description: Deleted
  /conditions:
    get:
      operationId: listConditions
      tags: [conditions]
      summary: List reusable conditions
      responses:
        "200":
          description: Condition list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Condition"
    post:
      operationId: createCondition
      tags: [conditions]
      summary: Create condition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConditionInput"
      responses:
        "201":
          description: Created condition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Condition"
  /conditions/{conditionId}:
    patch:
      operationId: updateCondition
      tags: [conditions]
      summary: Update condition
      parameters:
        - $ref: "#/components/parameters/ConditionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConditionUpdate"
      responses:
        "200":
          description: Updated condition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Condition"
    delete:
      operationId: deleteCondition
      tags: [conditions]
      summary: Delete condition
      parameters:
        - $ref: "#/components/parameters/ConditionId"
      responses:
        "204":
          description: Deleted
  /markets:
    get:
      operationId: listMarkets
      tags: [markets]
      summary: List markets and instruments
      responses:
        "200":
          description: Market list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Market"
    post:
      operationId: createMarket
      tags: [markets]
      summary: Create market or instrument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketInput"
      responses:
        "201":
          description: Created market
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Market"
  /markets/{marketId}:
    patch:
      operationId: updateMarket
      tags: [markets]
      summary: Update market or instrument
      parameters:
        - $ref: "#/components/parameters/MarketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketUpdate"
      responses:
        "200":
          description: Updated market
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Market"
    delete:
      operationId: deleteMarket
      tags: [markets]
      summary: Delete market or instrument
      parameters:
        - $ref: "#/components/parameters/MarketId"
      responses:
        "204":
          description: Deleted
  /instruments:
    get:
      operationId: listInstruments
      tags: [market-data]
      summary: List provider-neutral instruments
      responses:
        "200":
          description: Instrument catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Instrument"
    post:
      operationId: createInstrument
      tags: [market-data]
      summary: Create a provider-neutral instrument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstrumentInput"
      responses:
        "201":
          description: Created instrument
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instrument"
  /market-data/biquote/catalog:
    get:
      operationId: getBiQuoteCatalog
      tags: [market-data]
      summary: List currently supported BiQuote instruments
      responses:
        "200":
          description: BiQuote-supported instrument catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BiQuoteCatalogItem"
  /market-data/biquote/markets:
    post:
      operationId: addBiQuoteMarket
      tags: [market-data]
      summary: Add a supported BiQuote market
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddBiQuoteMarketInput"
      responses:
        "201":
          description: Added or reused BiQuote market
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BiQuoteMarketResult"
  /instruments/{instrumentId}:
    patch:
      operationId: updateInstrument
      tags: [market-data]
      summary: Update a provider-neutral instrument
      parameters:
        - $ref: "#/components/parameters/InstrumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstrumentUpdate"
      responses:
        "200":
          description: Updated instrument
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instrument"
    delete:
      operationId: deleteInstrument
      tags: [market-data]
      summary: Delete an unused instrument
      parameters:
        - $ref: "#/components/parameters/InstrumentId"
      responses:
        "204":
          description: Deleted
  /market-data/sources:
    get:
      operationId: listMarketDataSources
      tags: [market-data]
      summary: List market-data source configurations
      responses:
        "200":
          description: Source list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketDataSource"
    post:
      operationId: createMarketDataSource
      tags: [market-data]
      summary: Register a future market-data source without credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketDataSourceInput"
      responses:
        "201":
          description: Created source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketDataSource"
  /market-data/sources/{sourceId}:
    patch:
      operationId: updateMarketDataSource
      tags: [market-data]
      summary: Update a market-data source configuration
      parameters:
        - $ref: "#/components/parameters/SourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketDataSourceUpdate"
      responses:
        "200":
          description: Updated source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketDataSource"
    delete:
      operationId: deleteMarketDataSource
      tags: [market-data]
      summary: Delete an unused market-data source
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "204":
          description: Deleted
  /market-data/mappings:
    get:
      operationId: listSourceInstrumentMappings
      tags: [market-data]
      summary: List provider-symbol mappings
      responses:
        "200":
          description: Source instrument mappings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceInstrumentMapping"
    post:
      operationId: createSourceInstrumentMapping
      tags: [market-data]
      summary: Map a canonical instrument to a provider symbol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceInstrumentMappingInput"
      responses:
        "201":
          description: Created mapping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceInstrumentMapping"
  /market-data/mappings/{mappingId}:
    patch:
      operationId: updateSourceInstrumentMapping
      tags: [market-data]
      summary: Update a provider-symbol mapping
      parameters:
        - $ref: "#/components/parameters/MappingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceInstrumentMappingUpdate"
      responses:
        "200":
          description: Updated mapping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceInstrumentMapping"
    delete:
      operationId: deleteSourceInstrumentMapping
      tags: [market-data]
      summary: Delete a provider-symbol mapping
      parameters:
        - $ref: "#/components/parameters/MappingId"
      responses:
        "204":
          description: Deleted
  /market-data/timeframes:
    get:
      operationId: listTimeframes
      tags: [market-data]
      summary: List supported candle timeframes
      responses:
        "200":
          description: Timeframe list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Timeframe"
    post:
      operationId: createTimeframe
      tags: [market-data]
      summary: Create a candle timeframe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeframeInput"
      responses:
        "201":
          description: Created timeframe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeframe"
  /market-data/timeframes/{timeframeId}:
    patch:
      operationId: updateTimeframe
      tags: [market-data]
      summary: Update a candle timeframe
      parameters:
        - $ref: "#/components/parameters/TimeframeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeframeUpdate"
      responses:
        "200":
          description: Updated timeframe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeframe"
    delete:
      operationId: deleteTimeframe
      tags: [market-data]
      summary: Delete an unused candle timeframe
      parameters:
        - $ref: "#/components/parameters/TimeframeId"
      responses:
        "204":
          description: Deleted
  /market-data/connections:
    get:
      operationId: listMarketDataConnections
      tags: [market-data]
      summary: List market-data connection states
      responses:
        "200":
          description: Connection states
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketDataConnection"
  /market-data/candles/refresh:
    post:
      operationId: refreshMarketDataCandles
      tags: [market-data]
      summary: Refresh normalized candles through a registered provider adapter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshCandlesInput"
      responses:
        "200":
          description: Candle refresh result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshCandlesResponse"
        "400":
          description: Provider or request error
  /market-data/quotes/stream:
    get:
      operationId: streamMarketDataQuotes
      tags: [market-data]
      summary: Stream normalized quotes as server-sent events
      parameters:
        - name: sourceId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: instrumentId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Server-sent quote and status events
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid source or instrument
  /market-data/candles:
    get:
      operationId: listCandles
      tags: [market-data]
      summary: Query stored provider candle data
      parameters:
        - name: instrumentId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: timeframeId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: sourceId
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 2000, default: 500 }
      responses:
        "200":
          description: Candle series, empty when no provider has ingested data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Candle"
  /market-data/summary:
    get:
      operationId: getMarketDataSummary
      tags: [market-data]
      summary: Summarize configured market-data architecture
      responses:
        "200":
          description: Architecture summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketDataSummary"
  /trades:
    get:
      operationId: listTrades
      tags: [trades]
      summary: List journal trades
      responses:
        "200":
          description: Trade list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trade"
    post:
      operationId: createTrade
      tags: [trades]
      summary: Log a trade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeInput"
      responses:
        "201":
          description: Created trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
  /trades/{tradeId}:
    patch:
      operationId: updateTrade
      tags: [trades]
      summary: Update journal trade
      parameters:
        - $ref: "#/components/parameters/TradeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeUpdate"
      responses:
        "200":
          description: Updated trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
    delete:
      operationId: deleteTrade
      tags: [trades]
      summary: Delete journal trade
      parameters:
        - $ref: "#/components/parameters/TradeId"
      responses:
        "204":
          description: Deleted
  /performance/summary:
    get:
      operationId: getPerformanceSummary
      tags: [performance]
      summary: Get performance summary
      responses:
        "200":
          description: Data-backed performance summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceSummary"
  /alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: List alerts
      responses:
        "200":
          description: Alert list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"
    post:
      operationId: createAlert
      tags: [alerts]
      summary: Create an alert
      requestBody:
        required: true
        content:
