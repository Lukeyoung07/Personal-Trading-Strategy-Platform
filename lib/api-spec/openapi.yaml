        averageTradingDay: { type: ["number", "null"] }
        bestDay:
          anyOf:
            - $ref: "#/components/schemas/JournalDay"
            - type: "null"
        worstDay:
          anyOf:
            - $ref: "#/components/schemas/JournalDay"
            - type: "null"
        daily:
          type: array
          items:
            $ref: "#/components/schemas/JournalDay"
        cumulative:
          type: array
          items:
            $ref: "#/components/schemas/JournalCumulativePoint"
        currentStreak:
          $ref: "#/components/schemas/JournalStreak"
        bestWinningStreak: { type: integer }
        bestLosingStreak: { type: integer }
        byStrategyVersion:
          type: array
          items:
            $ref: "#/components/schemas/PerformanceVersion"
    JournalDay:
      type: object
      required: [date, tradeCount, winningTrades, losingTrades, pnl, winRate, averageWinner, averageLoser, bestTrade, worstTrade, note]
      properties:
        date: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])-[0-9]{2}$" }
        tradeCount: { type: integer }
        winningTrades: { type: integer }
        losingTrades: { type: integer }
        pnl: { type: number }
        winRate: { type: ["number", "null"] }
        averageWinner: { type: ["number", "null"] }
        averageLoser: { type: ["number", "null"] }
        bestTrade: { type: ["number", "null"] }
        worstTrade: { type: ["number", "null"] }
        note: { type: ["string", "null"] }
    JournalCumulativePoint:
      type: object
      required: [date, cumulativePnl]
      properties:
        date: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])-[0-9]{2}$" }
        cumulativePnl: { type: number }
    JournalStreak:
      type: object
      required: [type, length]
      properties:
        type:
          type: string
          enum: [winning, losing, none]
        length: { type: integer }
    JournalDayNote:
      type: object
      required: [date, notes]
      properties:
        date: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])-[0-9]{2}$" }
        notes: { type: ["string", "null"] }
    JournalDayNoteInput:
      type: object
      required: [notes]
      properties:
        notes: { type: ["string", "null"], maxLength: 2000 }
    Alert:
      type: object
      required: [id, name, marketId, marketSymbol, monitorSessionId, strategyVersionId, sourceType, condition, threshold, status, message, triggeredAt, acknowledgedAt, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        marketId: { type: ["integer", "null"] }
        marketSymbol: { type: ["string", "null"] }
        monitorSessionId: { type: ["integer", "null"] }
        strategyVersionId: { type: ["integer", "null"] }
        strategyName: { type: ["string", "null"] }
        versionNumber: { type: ["integer", "null"] }
        sourceType:
          type: string
          enum: [manual, monitoring]
        condition: { type: string }
        threshold: { type: ["string", "null"] }
        status:
          type: string
          enum: [active, paused, triggered, acknowledged]
        message: { type: ["string", "null"] }
        triggeredAt: { type: ["string", "null"], format: date-time }
        acknowledgedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AlertInput:
      type: object
      required: [name, condition]
      properties:
        name: { type: string, minLength: 1 }
        marketId: { type: ["integer", "null"] }
        condition: { type: string, minLength: 1 }
        threshold: { type: ["string", "null"] }
        status:
          type: string
          enum: [active, paused]
          default: paused
    AlertUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        marketId: { type: ["integer", "null"] }
        condition: { type: string, minLength: 1 }
        threshold: { type: ["string", "null"] }
        status:
          type: string
          enum: [active, paused, triggered, acknowledged]
    Backtest:
      type: object
      required: [id, strategyId, strategyName, strategyVersionId, versionNumber, instrumentId, instrumentSymbol, timeframeId, timeframeLabel, preset, startDate, endDate, status, candlesProcessed, tradeCount, progress, winningTrades, losingTrades, winRate, totalPnl, resultMessage, executionAssumptions, errorMessage, startedAt, completedAt, createdAt]
      properties:
        id: { type: integer }
        strategyId: { type: integer }
        strategyName: { type: string }
        strategyVersionId: { type: integer }
        versionNumber: { type: integer }
        instrumentId: { type: integer }
        instrumentSymbol: { type: string }
        timeframeId: { type: integer }
        timeframeLabel: { type: string }
        preset:
          type: string
          enum: [last_7_days, last_30_days, last_90_days, last_6_months, last_1_year, custom]
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        status:
          type: string
          enum: [configured, pending, queued, downloading_data, processing, running, completed, failed, cancelled]
        candlesProcessed: { type: integer }
        tradeCount: { type: integer }
        progress:
          $ref: "#/components/schemas/BacktestProgress"
        winningTrades: { type: integer }
        losingTrades: { type: integer }
        winRate: { type: ["number", "null"] }
        totalPnl: { type: ["number", "null"] }
        timeframeSummaries:
          type: array
          description: Actual provider candle series loaded for this run, including each condition timeframe.
          items:
            $ref: "#/components/schemas/BacktestTimeframeSummary"
        resultMessage: { type: ["string", "null"] }
        executionAssumptions: { type: ["string", "null"] }
        errorMessage: { type: ["string", "null"] }
        startedAt: { type: ["string", "null"], format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    BacktestProgress:
      type: object
      required: [phase, message, timeframes, candlesDownloaded, candlesTotal, processingIndex, processingTotal]
      properties:
        phase:
          type: string
          enum: [queued, downloading_data, processing, completed, failed, cancelled]
        message: { type: string }
        timeframes:
          type: array
          items:
            $ref: "#/components/schemas/BacktestProgressTimeframe"
        candlesDownloaded: { type: integer }
        candlesTotal: { type: ["integer", "null"] }
        processingIndex: { type: ["integer", "null"] }
        processingTotal: { type: ["integer", "null"] }
    BacktestProgressTimeframe:
      type: object
      required: [timeframeId, code, label, status, candlesProcessed, earliestCandle, latestCandle, coverageState]
      properties:
        timeframeId: { type: integer }
        code: { type: string }
        label: { type: string }
        status:
          type: string
          enum: [queued, downloading, complete, failed]
        candlesProcessed: { type: integer }
        earliestCandle: { type: ["string", "null"], format: date-time }
        latestCandle: { type: ["string", "null"], format: date-time }
        coverageState: { type: string }
    BacktestTimeframeSummary:
      type: object
      required: [timeframeId, code, label, candlesProcessed, earliestCandle, latestCandle, isExecutionTimeframe]
      properties:
        timeframeId: { type: integer }
        code: { type: string }
        label: { type: string }
        candlesProcessed: { type: integer }
        earliestCandle: { type: string, format: date-time }
        latestCandle: { type: string, format: date-time }
        isExecutionTimeframe: { type: boolean }
    BacktestTrade:
      type: object
      required: [id, backtestId, strategyId, strategyVersionId, instrumentId, timeframeId, side, entryTime, entryPrice, stopLoss, takeProfit, exitTime, exitPrice, pnl, entryReason, exitReason, createdAt]
      properties:
        id: { type: integer }
        backtestId: { type: integer }
        strategyId: { type: integer }
        strategyVersionId: { type: integer }
        instrumentId: { type: integer }
        timeframeId: { type: integer }
        side:
          type: string
          enum: [long, short]
        entryTime: { type: string, format: date-time }
        entryPrice: { type: number }
        stopLoss: { type: ["number", "null"] }
        takeProfit: { type: ["number", "null"] }
        exitTime: { type: string, format: date-time }
        exitPrice: { type: number }
        pnl: { type: number }
        entryReason: { type: string }
        exitReason: { type: string }
        createdAt: { type: string, format: date-time }
    BacktestCandle:
      type: object
      required: [id, backtestId, sourceId, instrumentId, timeframeId, openTime, closeTime, open, high, low, close, volume, isClosed, createdAt]
      properties:
        id: { type: integer }
        backtestId: { type: integer }
        sourceId: { type: integer }
        instrumentId: { type: integer }
        timeframeId: { type: integer }
        openTime: { type: string, format: date-time }
        closeTime: { type: ["string", "null"], format: date-time }
        open: { type: number }
        high: { type: number }
        low: { type: number }
        close: { type: number }
        volume: { type: ["number", "null"] }
        isClosed: { type: boolean }
        createdAt: { type: string, format: date-time }
    BacktestStatistics:
      type: object
      required: [winningTrades, losingTrades, winRate, totalPnl, averageWinningTrade, averageLosingTrade, largestWinningTrade, largestLosingTrade, maximumDrawdown, profitFactor, equityCurve]
      properties:
        winningTrades: { type: integer }
        losingTrades: { type: integer }
        winRate: { type: ["number", "null"] }
        totalPnl: { type: ["number", "null"] }
        averageWinningTrade: { type: ["number", "null"] }
        averageLosingTrade: { type: ["number", "null"] }
        largestWinningTrade: { type: ["number", "null"] }
        largestLosingTrade: { type: ["number", "null"] }
        maximumDrawdown: { type: ["number", "null"] }
        profitFactor: { type: ["number", "null"] }
        equityCurve:
          type: array
          items:
            type: object
            required: [timestamp, equity, tradeId]
            properties:
              timestamp: { type: string, format: date-time }
              equity: { type: number }
              tradeId: { type: ["integer", "null"] }
    BacktestResults:
      type: object
      required: [backtest, trades, candles, statistics]
      properties:
        backtest:
          $ref: "#/components/schemas/Backtest"
        trades:
          type: array
          items:
            $ref: "#/components/schemas/BacktestTrade"
        candles:
          type: array
          items:
            $ref: "#/components/schemas/BacktestCandle"
        statistics:
          $ref: "#/components/schemas/BacktestStatistics"
    BacktestInput:
      type: object
      required: [strategyId, strategyVersionId, instrumentId, timeframeId, preset, startDate, endDate]
      properties:
        strategyId: { type: integer, minimum: 1 }
        strategyVersionId: { type: integer, minimum: 1 }
        instrumentId: { type: integer, minimum: 1 }
        timeframeId: { type: integer, minimum: 1 }
        preset:
          type: string
          enum: [last_7_days, last_30_days, last_90_days, last_6_months, last_1_year, custom]
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
    AssistantMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content: { type: string, minLength: 1, maxLength: 6000 }
    AssistantContext:
      type: object
      properties:
        page: { type: string, maxLength: 120 }
        strategyId: { type: ["integer", "null"], minimum: 1 }
        versionId: { type: ["integer", "null"], minimum: 1 }
        backtestId: { type: ["integer", "null"], minimum: 1 }
        instrumentId: { type: ["integer", "null"], minimum: 1 }
        timeframeId: { type: ["integer", "null"], minimum: 1 }
        startDate: { type: ["string", "null"], format: date-time }
        endDate: { type: ["string", "null"], format: date-time }
    AssistantChatInput:
      type: object
      required: [message, messages, context]
      properties:
        message: { type: string, minLength: 1, maxLength: 2000 }
        messages:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/AssistantMessage"
        context:
          $ref: "#/components/schemas/AssistantContext"
    AssistantStrategyCondition:
      type: object
      required: [name, stage, requirement, conceptName, timeframe, direction, triggerRules, parameters, ruleSupported]
      properties:
        name: { type: string }
        stage:
          type: string
          enum: [entry, confirmation, invalidation, exit]
        requirement:
          type: string
          enum: [required, optional]
        conceptName: { type: string }
        timeframe: { type: string }
        direction:
          type: string
          enum: [long, short, both]
        triggerRules: { type: string }
        parameters: { type: ["object", "null"], additionalProperties: true }
        ruleSupported: { type: boolean }
        supported: { type: boolean }
    AssistantCompatibility:
      type: object
      required: [compatible, unsupportedConditions]
      properties:
        compatible: { type: boolean }
        unsupportedConditions:
          type: array
          items: { type: string }
    AssistantConceptReference:
      type: object
      required: [name, supported, explanation]
      properties:
        name: { type: string }
        supported: { type: boolean }
        explanation: { type: string }
    AssistantStrategyDraft:
      type: object
      required: [name, description, direction, marketSymbol, timeframes, conditions, riskManagementRules, compatibility]
      properties:
        name: { type: string }
        description: { type: string }
        direction:
          type: string
          enum: [long, short, both]
        marketSymbol: { type: ["string", "null"] }
        timeframes:
          type: array
          items: { type: string }
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/AssistantStrategyCondition"
        conceptsUsed:
          type: array
          items:
            $ref: "#/components/schemas/AssistantConceptReference"
        riskManagementRules: { type: ["string", "null"] }
        compatibility:
          $ref: "#/components/schemas/AssistantCompatibility"
    AssistantBacktestSetup:
      type: object
      required: [strategyId, versionId, instrumentId, timeframeId, startDate, endDate]
      properties:
        strategyId: { type: ["integer", "null"] }
        versionId: { type: ["integer", "null"] }
        instrumentId: { type: ["integer", "null"] }
        timeframeId: { type: ["integer", "null"] }
        startDate: { type: ["string", "null"], format: date-time }
        endDate: { type: ["string", "null"], format: date-time }
    AssistantChatResponse:
      type: object
      required: [status, reply, provider]
      properties:
        status:
          type: string
          enum: [available, unavailable, rate_limited]
        reply: { type: string }
        provider:
          type: string
          enum: [openrouter/free]
        intent: { type: ["string", "null"] }
        strategyDraft:
          oneOf:
            - $ref: "#/components/schemas/AssistantStrategyDraft"
            - type: "null"
        compatibility:
          oneOf:
            - $ref: "#/components/schemas/AssistantCompatibility"
            - type: "null"
        backtestSetup:
          oneOf:
            - $ref: "#/components/schemas/AssistantBacktestSetup"
            - type: "null"
    UserSettings:
      type: object
      required: [id, timezone, baseCurrency, defaultRiskUnit, compactMode, updatedAt]
      properties:
        id: { type: integer }
        timezone: { type: string }
        baseCurrency: { type: string }
        defaultRiskUnit:
          type: string
          enum: [percent, amount, r]
        compactMode: { type: boolean }
        updatedAt: { type: string, format: date-time }
    UserSettingsUpdate:
      type: object
      properties:
        timezone: { type: string, minLength: 1 }
        baseCurrency: { type: string, minLength: 1 }
        defaultRiskUnit:
          type: string
          enum: [percent, amount, r]
        compactMode: { type: boolean }

