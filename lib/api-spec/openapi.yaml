components:
  parameters:
    StrategyId:
      name: strategyId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ConceptId:
      name: conceptId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ConditionId:
      name: conditionId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    VersionId:
      name: versionId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    MarketId:
      name: marketId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    InstrumentId:
      name: instrumentId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    SourceId:
      name: sourceId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    TimeframeId:
      name: timeframeId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    MappingId:
      name: mappingId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    TradeId:
      name: tradeId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    BacktestId:
      name: backtestId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    AlertId:
      name: alertId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    EconomicEventId:
      name: eventId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]
    EconomicEventMarketMapping:
      type: object
      required: [id, eventId, marketId, marketLabel, impactDirection, notes]
      properties:
        id: { type: integer }
        eventId: { type: integer }
        marketId: { type: ["integer", "null"] }
        marketLabel: { type: ["string", "null"] }
        impactDirection: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
    EconomicEvent:
      type: object
      required: [id, providerKey, providerEventId, dedupeKey, name, scheduledAt, timePrecision, impact, providerImpact, applicationImpact, impactSource, impactClassificationReason, region, currency, previous, forecast, actual, releaseStatus, sourceName, sourceUrl, sourceUpdatedAt, createdAt, updatedAt, affectedMarkets]
      properties:
        id: { type: integer }
        providerKey: { type: string }
        providerEventId: { type: ["string", "null"] }
        dedupeKey: { type: string }
        name: { type: string }
        scheduledAt: { type: string, format: date-time }
        timePrecision: { type: string, enum: [date, datetime] }
        impact:
          anyOf:
            - $ref: "#/components/schemas/EconomicEventImpact"
            - type: "null"
          description: Effective impact for display and filtering. Use providerImpact to inspect the original provider value.
        providerImpact:
          anyOf:
            - $ref: "#/components/schemas/EconomicEventImpact"
            - type: "null"
          description: Original impact supplied by the provider, if any.
        applicationImpact:
          anyOf:
            - $ref: "#/components/schemas/EconomicEventImpact"
            - type: "null"
          description: Deterministic application classification when providerImpact is absent.
        impactSource:
          type: string
          enum: [provider, application, unclassified]
        impactClassificationReason:
          type: ["string", "null"]
          description: Rule or explanation for the application classification.
        region: { type: ["string", "null"] }
        currency: { type: ["string", "null"] }
        previous: { type: ["string", "null"] }
        forecast: { type: ["string", "null"] }
        actual: { type: ["string", "null"] }
        releaseStatus: { type: string, enum: [upcoming, live, released, delayed, cancelled, unknown] }
        sourceName: { type: ["string", "null"] }
        sourceUrl: { type: ["string", "null"], format: uri }
        sourceUpdatedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        affectedMarkets:
          type: array
          items:
            $ref: "#/components/schemas/EconomicEventMarketMapping"
    EconomicEventInput:
      type: object
      required: [providerKey, name, scheduledAt]
      properties:
        providerKey: { type: string, minLength: 1 }
        providerEventId: { type: ["string", "null"] }
        dedupeKey: { type: ["string", "null"] }
        name: { type: string, minLength: 1 }
        scheduledAt: { type: string, format: date-time }
        timePrecision: { type: string, enum: [date, datetime] }
        impact:
          anyOf:
            - $ref: "#/components/schemas/EconomicEventImpact"
            - type: "null"
          description: Optional impact supplied by the provider. Application classification is calculated when omitted.
        region: { type: ["string", "null"] }
        currency: { type: ["string", "null"] }
        previous: { type: ["string", "null"] }
        forecast: { type: ["string", "null"] }
        actual: { type: ["string", "null"] }
        releaseStatus: { type: string, enum: [upcoming, live, released, delayed, cancelled, unknown] }
        sourceName: { type: ["string", "null"] }
        sourceUrl: { type: ["string", "null"], format: uri }
        sourceUpdatedAt: { type: ["string", "null"], format: date-time }
        affectedMarkets:
          type: array
          items:
            $ref: "#/components/schemas/EconomicEventMarketMappingInput"
    EconomicEventMarketMappingInput:
      type: object
      properties:
        marketId: { type: ["integer", "null"] }
        marketLabel: { type: ["string", "null"] }
        impactDirection: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
    EconomicEventImpact:
      type: string
      enum: [high, medium, low]
    EconomicEventUpdate:
      type: object
      properties:
        providerEventId: { type: ["string", "null"] }
        name: { type: string, minLength: 1 }
        scheduledAt: { type: string, format: date-time }
        timePrecision: { type: string, enum: [date, datetime] }
        impact:
          anyOf:
            - $ref: "#/components/schemas/EconomicEventImpact"
            - type: "null"
          description: Optional impact supplied by the provider. Application classification is calculated when omitted.
        region: { type: ["string", "null"] }
        currency: { type: ["string", "null"] }
        previous: { type: ["string", "null"] }
        forecast: { type: ["string", "null"] }
        actual: { type: ["string", "null"] }
        releaseStatus: { type: string, enum: [upcoming, live, released, delayed, cancelled, unknown] }
        sourceName: { type: ["string", "null"] }
        sourceUrl: { type: ["string", "null"], format: uri }
        sourceUpdatedAt: { type: ["string", "null"], format: date-time }
        affectedMarkets:
          type: array
          items:
            $ref: "#/components/schemas/EconomicEventMarketMappingInput"
    EconomicEventsList:
      type: object
      required: [providerConnected, providerName, message, events]
      properties:
        providerConnected: { type: boolean }
        providerName: { type: ["string", "null"] }
        message: { type: string }
        events:
          type: array
          items:
            $ref: "#/components/schemas/EconomicEvent"
    EconomicEventProviderStatus:
      type: object
      required: [providerConnected, providerName, message]
      properties:
        providerConnected: { type: boolean }
        providerName: { type: ["string", "null"] }
        message: { type: string }
    DashboardSummary:
      type: object
      required: [strategyCount, tradeCount, alertCount, conceptCount, marketCount, activeStrategyCount, hasPerformanceData]
      properties:
        strategyCount: { type: integer }
        tradeCount: { type: integer }
        alertCount: { type: integer }
        conceptCount: { type: integer }
        marketCount: { type: integer }
        activeStrategyCount: { type: integer }
        hasPerformanceData: { type: boolean }
        latestTradeAt: { type: ["string", "null"], format: date-time }
    StrategyMonitoringEvaluationRequest:
      type: object
      properties:
        strategyId: { type: integer, minimum: 1 }
        sourceId: { type: ["integer", "null"], minimum: 1 }
    StrategyMonitorCondition:
      type: object
      required: [strategyVersionConditionId, conceptId, conceptName, conditionOrder, name, stage, requirement, timeframe, status, reasonCode, reason, lastEvaluationAt, lastMarketDataAt]
      properties:
        strategyVersionConditionId: { type: integer }
        conceptId: { type: integer }
        conceptName: { type: string }
        conditionOrder: { type: integer }
        name: { type: string }
        stage: { type: string }
        requirement:
          type: string
          enum: [required, optional]
        timeframe: { type: string }
        status:
          type: string
          enum: [not_met, met, waiting, invalid]
        reasonCode: { type: ["string", "null"] }
        reason: { type: ["string", "null"] }
        lastEvaluationAt: { type: ["string", "null"], format: date-time }
        lastMarketDataAt: { type: ["string", "null"], format: date-time }
    StrategyMonitor:
      type: object
      required: [monitorSessionId, strategyId, strategyName, strategyVersionId, versionNumber, instrumentId, instrumentSymbol, sourceId, monitoringStatus, overallStatus, statusReason, conditionCount, metCount, notMetCount, waitingCount, invalidCount, remainingCount, progressPercent, lastEvaluationAt, lastMarketDataAt, resetStatus, resetReason, conditions]
      properties:
        monitorSessionId: { type: ["integer", "null"] }
        strategyId: { type: integer }
        strategyName: { type: string }
        strategyVersionId: { type: integer }
        versionNumber: { type: integer }
        instrumentId: { type: ["integer", "null"] }
        instrumentSymbol: { type: ["string", "null"] }
        sourceId: { type: ["integer", "null"] }
        monitoringStatus:
          type: string
          enum: [not_started, waiting, monitoring, paused, error]
        overallStatus:
          type: string
          enum: [not_met, met, waiting, invalid]
        statusReason: { type: ["string", "null"] }
        conditionCount: { type: integer }
        metCount: { type: integer }
        notMetCount: { type: integer }
        waitingCount: { type: integer }
        invalidCount: { type: integer }
        remainingCount: { type: integer }
        progressPercent: { type: integer, minimum: 0, maximum: 100 }
        lastEvaluationAt: { type: ["string", "null"], format: date-time }
        lastMarketDataAt: { type: ["string", "null"], format: date-time }
        resetStatus:
          type: string
          enum: [not_configured, waiting, ready]
        resetReason: { type: ["string", "null"] }
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/StrategyMonitorCondition"
    Strategy:
      type: object
      required: [id, name, description, status, currentVersion, currentVersionId, marketId, assetClass, direction, timeframes, riskManagementRules, resetRules, alertRules, tradeCount, winRate, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: ["string", "null"] }
        status:
          type: string
          enum: [draft, active, archived]
        currentVersion: { type: ["integer", "null"] }
        currentVersionId: { type: ["integer", "null"] }
        marketId: { type: ["integer", "null"] }
        marketSymbol: { type: ["string", "null"] }
        assetClass: { type: ["string", "null"] }
        direction:
          type: string
          enum: [long, short, both]
        timeframes:
          type: array
          items: { type: string }
        riskManagementRules: { type: ["string", "null"] }
        resetRules: { type: ["string", "null"] }
        alertRules: { type: ["string", "null"] }
        tradeCount: { type: integer }
        winRate: { type: ["number", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StrategyInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        status:
          type: string
          enum: [draft, active, archived]
          default: draft
        marketId: { type: ["integer", "null"] }
        assetClass: { type: ["string", "null"] }
        direction:
          type: string
          enum: [long, short, both]
          default: both
        timeframes:
          type: array
          items: { type: string }
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/StrategyConditionInput"
        riskManagementRules: { type: ["string", "null"] }
        resetRules: { type: ["string", "null"] }
        alertRules: { type: ["string", "null"] }
    StrategyDuplicateInput:
      type: object
      properties:
        name: { type: ["string", "null"], minLength: 1 }
    StrategyUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        status:
          type: string
          enum: [draft, active, archived]
        marketId: { type: ["integer", "null"] }
        assetClass: { type: ["string", "null"] }
        direction:
          type: string
          enum: [long, short, both]
        timeframes:
          type: array
          items: { type: string }
        riskManagementRules: { type: ["string", "null"] }
        resetRules: { type: ["string", "null"] }
        alertRules: { type: ["string", "null"] }
    StrategyVersion:
      type: object
      required: [id, strategyId, versionNumber, isActive, label, name, description, thesis, entryRules, exitRules, riskRules, notes, marketId, marketSymbol, assetClass, direction, timeframes, riskManagementRules, resetRules, alertRules, conditionCount, tradeCount, winRate, netPnl, averagePnl, createdAt]
      properties:
        id: { type: integer }
        strategyId: { type: integer }
        versionNumber: { type: integer }
        isActive: { type: boolean }
        label: { type: ["string", "null"] }
        name: { type: string }
        description: { type: ["string", "null"] }
        thesis: { type: ["string", "null"] }
        entryRules: { type: ["string", "null"] }
        exitRules: { type: ["string", "null"] }
        riskRules: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        marketId: { type: ["integer", "null"] }
        marketSymbol: { type: ["string", "null"] }
        assetClass: { type: ["string", "null"] }
        direction:
          type: string
          enum: [long, short, both]
        timeframes:
          type: array
          items: { type: string }
        riskManagementRules: { type: ["string", "null"] }
        resetRules: { type: ["string", "null"] }
        alertRules: { type: ["string", "null"] }
        conditionCount: { type: integer }
        tradeCount: { type: integer }
        winRate: { type: ["number", "null"] }
        netPnl: { type: ["number", "null"] }
        averagePnl: { type: ["number", "null"] }
        createdAt: { type: string, format: date-time }
    StrategyVersionInput:
      type: object
      properties:
